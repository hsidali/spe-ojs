# Apache hardening for the OJS app container.
# Bind-mounted to /etc/apache2/conf-enabled/zz-security.conf (loaded after the image's
# own security.conf, so these values win). Edit here, then: docker compose restart app

# mod_headers is not enabled in the pkpofficial image: load it here.
<IfModule !headers_module>
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>

# Don't advertise versions.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Silence "Could not reliably determine the server's fully qualified domain name".
ServerName localhost

<IfModule headers_module>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    # Only send HSTS once the site is served over HTTPS (behind the future reverse proxy).
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
    Header always unset X-Powered-By
</IfModule>

# Build/dependency metadata and source files that never need to be public.
<LocationMatch "(^|/)(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|\.git(/|$)|\.env)">
    Require all denied
</LocationMatch>
<FilesMatch "\.(tpl|sql|bak|orig|swp|dist|md|sh|yml|yaml|log)$">
    Require all denied
</FilesMatch>
# OJS reads its config from disk; it must never be fetched over HTTP (if PHP ever
# stopped executing, the raw file with its secrets would be served).
<FilesMatch "^config(\.TEMPLATE)?\.inc\.php$">
    Require all denied
</FilesMatch>

; PHP overrides for the OJS app container.
; Bind-mounted to /usr/local/etc/php/conf.d/custom.ini — edit here, then:
;   docker compose restart app
; Write changes in place (editor or `cat > file`), never with `sed -i` / mv:
; that would break the single-file bind mount.

;;;;;;;;;;;;;;;;;;;
; Resource Limits ;
;;;;;;;;;;;;;;;;;;;
memory_limit = 256M
max_execution_time = 1200

;;;;;;;;;;;;;;;;
; File Uploads ;
;;;;;;;;;;;;;;;;
file_uploads = On
post_max_size = 50M
upload_max_filesize = 50M

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Errors: log them, never show them ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Do not advertise the PHP version (headers) ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
expose_php = Off

;;;;;;;;;;;;;
; Time zone ;
;;;;;;;;;;;;;
date.timezone = Africa/Algiers

;;;;;;;;;;;
; OPcache ;
;;;;;;;;;;;
; (the old file used "opcache_..." names, which PHP silently ignored)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

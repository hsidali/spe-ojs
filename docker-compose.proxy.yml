# Reverse proxy (Caddy) in front of OJS, for the journal's domain name.
#
# Not used until scripts/setup-domain.sh is run. That script writes
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
# into .env, so every plain `docker compose ...` command then includes this file.
#
# HTTPS: Caddy obtains and renews a Let's Encrypt certificate by itself.
# Certificates are kept in ./volumes/caddy/data (included in scripts/backup.sh).

services:
  proxy:
    image: ${CADDY_IMAGE:-caddy:2.10}
    container_name: "pkp_proxy_${COMPOSE_PROJECT_NAME:-demo}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    volumes:
      # Generated by scripts/setup-domain.sh. Edit in place, then: docker compose restart proxy
      - ./volumes/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy/data:/data       # certificates + Let's Encrypt account: keep it
      - ./volumes/caddy/config:/config
    networks:
      - inside
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
